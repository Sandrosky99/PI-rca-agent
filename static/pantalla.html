<!doctype html>
<!--
  Pantalla de la sala de control.

  Diseño completo en docs/DISENO-INTERACCION-HUMANA.md. Fase 1 (mostrar) y
  Fase 2 (recoger el veredicto humano). Lo que todavía NO hay es el reanálisis
  con feedback ni el cierre automático por reloj: eso es la Fase 3.

  Sin dependencias externas a propósito: la máquina que sirve esto no tiene por
  qué tener salida a internet, y un monitor de sala de control que se queda en
  blanco porque no carga una fuente de un CDN es peor que uno feo.

  Se refresca por sondeo y no con SSE. Para un kiosco que mira cuatro incidentes
  cada pocos segundos, el sondeo es más simple y se recupera solo de un corte de
  red sin código de reconexión.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RCA — Sala de control</title>
<style>
  /* Paleta clara. Los neutros llevan una ligera desviación fría hacia el
     acento para que no parezcan grises de fábrica, y el contraste del texto se
     mantiene alto: esto se lee a distancia y a veces con luz de nave. */
  :root{
    --fondo:#F4F6F8; --panel:#FFFFFF; --panel-2:#EFF3F6; --borde:#D7DEE5;
    --texto:#16212C; --texto-2:#4A5A6A; --tenue:#78889A;
    --acento:#0E6E8C; --acento-fondo:#DDEDF3;
    --ok:#1E7346; --ok-fondo:#E2F1E8;
    --aviso:#8A5D0C; --aviso-fondo:#F8EEDB;
    --malo:#A03B26; --malo-fondo:#F8E6E1;
    --neutro:#55697C; --neutro-fondo:#E6EBF0;
  }
  *{box-sizing:border-box}
  /* La pagina NO se desplaza: ocupa la ventana y cada panel se desplaza por
     dentro. Asi la lista de incidentes sigue a la vista mientras se lee el
     detalle -- si no, con muchos incidentes hay que bajar tanto que se pierde
     de vista cual esta seleccionado, y el panel central queda sin referencia. */
  body{
    margin:0; background:var(--fondo); color:var(--texto);
    font:16px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
    padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--borde);
    flex:0 0 auto; z-index:5;
  }
  header h1{margin:0; font-size:17px; letter-spacing:.06em; text-transform:uppercase; color:var(--acento)}
  .reloj{margin-left:auto; font-size:13px; color:var(--tenue); font-variant-numeric:tabular-nums}
  .caido{color:var(--malo); font-weight:600}

  /* min-height:0 no es decorativo: sin el, un hijo de flex o de grid se niega
     a encogerse por debajo de su contenido y el overflow-y de los paneles no
     llega a activarse nunca. Es el motivo clasico de que "no funciona el
     scroll" en este tipo de maquetado. */
  .cols{
    display:grid; grid-template-columns:340px 1fr;
    flex:1 1 auto; min-height:0;
  }
  @media(max-width:900px){
    /* En pantalla estrecha no hay dos columnas que mantener a la vista, asi que
       se deja desplazar la pagina entera, que es lo natural en un movil. */
    body{height:auto; overflow:visible}
    .cols{grid-template-columns:1fr}
    .lista,.detalle{overflow:visible}
    .lista{max-height:none}
  }

  /* ---- lista / selector de incidentes ---- */
  .lista{
    border-right:1px solid var(--borde); background:var(--panel);
    overflow-y:auto; min-height:0;
  }
  /* Filtro por estado. Solo aparecen los estados que existen ahora mismo: una
     botonera con seis opciones de las que cuatro dan cero no ayuda a nadie. */
  .filtros{
    display:flex; flex-wrap:wrap; gap:6px; padding:0 18px 12px;
  }
  .filtro{
    font:inherit; font-size:12.5px; cursor:pointer; padding:4px 11px;
    border-radius:20px; border:1px solid var(--borde);
    background:var(--panel); color:var(--texto-2);
  }
  .filtro:hover{border-color:var(--acento); color:var(--acento)}
  .filtro[aria-pressed="true"]{
    background:var(--acento); border-color:var(--acento); color:#FFFFFF; font-weight:600;
  }
  .filtro .cuenta{opacity:.7; margin-left:5px; font-variant-numeric:tabular-nums}

  /* Las dos pestañas. Activos y cerrados son dos mundos, no dos filtros: el
     periodo y el estado operan DENTRO del que se este mirando. */
  .cabecera-lista{
    position:sticky; top:0; background:var(--panel); z-index:4;
    border-bottom:1px solid var(--borde);
  }
  .pestanas{display:flex; border-bottom:1px solid var(--borde)}
  .pestana{
    flex:1; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    padding:11px 8px; border:none; background:none; color:var(--tenue);
    border-bottom:3px solid transparent;
  }
  .pestana:hover{color:var(--texto)}
  .pestana[aria-selected="true"]{color:var(--acento); border-bottom-color:var(--acento)}
  .pestana .cuenta{
    margin-left:6px; font-variant-numeric:tabular-nums; opacity:.75; font-weight:400;
  }

  /* Acotar cuantos se muestran. Va debajo de las pestañas porque decide QUE hay
     en la lista; los filtros de estado operan dentro de lo que esto deja pasar. */
  .rango{
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    padding:10px 18px;
  }
  .rango select,.rango input{
    font:inherit; font-size:12.5px; padding:3px 7px; border-radius:6px;
    border:1px solid var(--borde); background:var(--panel); color:var(--texto);
  }
  .rango input[type=datetime-local]{font-size:11.5px}
  /* Sin las flechitas de subir/bajar: para pasar de 50 a 200 no sirven, y el
     numero se teclea igual. */
  .rango input[type=number]{
    width:58px; font-variant-numeric:tabular-nums; text-align:right;
    -moz-appearance:textfield; appearance:textfield;
  }
  .rango input[type=number]::-webkit-outer-spin-button,
  .rango input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  /* La etiqueta del numero dice "Mas recientes" y no "Max." a proposito: sin
     ello, ver "50 de 213" deja la duda de cuales son esos 50. Que ademas sea el
     maximo se entiende solo. */
  .rango label{font-size:11px; color:var(--tenue); letter-spacing:.06em; text-transform:uppercase}
  /* Cada etiqueta con su control en su propia linea. Sin esto, el ajuste de
     linea partia el par: "MAS RECIENTES" se quedaba arriba con el periodo y el
     numero caia solo abajo, sin decir de que era. */
  .linea{display:flex; flex-wrap:wrap; gap:6px; align-items:center; width:100%}
  .personalizado{display:flex; flex-wrap:wrap; gap:5px; align-items:center; width:100%}
  /* En el color de acento y no en gris: quien mira tiene que ENTERARSE de que
     hay mas de los que ve. Pero no en ambar ni en rojo, que son los tonos de
     los estados que piden accion -- esto informa, no alarma. */
  .aviso-truncado{
    padding:8px 18px; font-size:12.5px; font-weight:600; color:var(--acento);
    background:var(--acento-fondo); border-bottom:1px solid var(--borde);
  }
  .fila{
    display:block; width:100%; text-align:left; background:none; border:none;
    border-bottom:1px solid var(--borde); padding:12px 18px; cursor:pointer;
    color:inherit; font:inherit;
  }
  .fila:hover{background:var(--panel-2)}
  .fila[aria-current="true"]{background:var(--panel-2); box-shadow:inset 3px 0 0 var(--acento)}
  .fila .act{font-weight:600; font-size:15px}
  .fila .sub{font-size:13px; color:var(--texto-2); margin-top:2px}
  .fila .pie{display:flex; gap:10px; align-items:center; margin-top:7px}
  /* La fila sigue en la lista porque esta seleccionada, no porque cumpla la
     consulta. La chincheta lo dice de un vistazo y sin gastar palabras; el
     texto queda libre para decir solo QUE ha cambiado. */
  .fila .fijada{
    margin-top:7px; font-size:11.5px; line-height:1.35; color:var(--acento);
    display:flex; gap:6px; align-items:baseline;
  }
  .fila .chincheta{font-size:10.5px; flex:0 0 auto}

  /* ---- detalle ---- */
  .detalle{padding:22px 28px; overflow-y:auto; min-height:0}
  .vacio{color:var(--tenue); padding:40px 0}

  /* Jerarquia de la cabecera, de mas a menos importante:
       1. el estado         -- lo primero que hay que saber
       2. el activo         -- de que maquina hablamos
       3. QUE le pasa       -- el indicador y en que direccion se ha ido
       4. contexto y tiempo -- tenue, para quien lo necesite
     Los numeros (valor y limite) van DENTRO de la frase del problema y no en
     cajas propias: sueltos obligan a recomponer la frase mentalmente. */
  .titulo{font-size:26px; font-weight:600; margin:6px 0 10px; letter-spacing:-.01em}
  .problema{
    font-size:19px; color:var(--texto); margin:0 0 6px; line-height:1.35;
    padding-left:12px; border-left:3px solid var(--acento);
  }
  .problema .kpi{font-weight:600}
  .problema .cifras{
    display:block; font-size:14.5px; color:var(--texto-2); margin-top:3px;
    font-variant-numeric:tabular-nums;
  }
  .contexto{
    color:var(--tenue); font-size:13.5px; margin:14px 0 0;
    display:flex; flex-wrap:wrap; gap:4px 14px;
  }
  .contexto .sep{color:var(--borde)}
  .contexto b{color:var(--texto-2); font-weight:400}
  .bloque-cabecera{padding-bottom:18px; border-bottom:1px solid var(--borde); margin-bottom:4px}

  h3{font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--tenue); margin:26px 0 12px}
  /* Cada causa se lee en tres saltos: QUE pasa (una frase), POR QUE lo decimos
     (hechos sueltos) y QUE hacer. Antes era un solo parrafo y habia que
     leerselo entero para llegar a lo unico accionable. */
  .causa{
    background:var(--panel); border:1px solid var(--borde);
    border-radius:8px; padding:0; margin-bottom:14px; overflow:hidden;
  }
  .causa .n{
    font-size:11px; color:var(--tenue); font-weight:600; letter-spacing:.1em;
    padding:10px 18px 2px;
  }
  .causa .q{
    font-size:18px; font-weight:600; margin:0; line-height:1.35;
  }
  .bloque-problema{padding-top:4px}
  .parrafo{margin:0; color:var(--texto-2); font-size:15px; line-height:1.55}
  .motivo{
    background:var(--malo-fondo); border-left:3px solid var(--malo);
    border-radius:0 8px 8px 0; padding:13px 16px; margin:0;
    color:var(--texto); font-size:15px; max-width:70ch;
  }
  .bloque{padding:13px 18px}
  .bloque + .bloque{border-top:1px solid var(--borde)}
  .bloque > b{
    color:var(--tenue); font-size:10.5px; letter-spacing:.12em;
    text-transform:uppercase; display:block; margin-bottom:7px; font-weight:600;
  }
  .causa ul{margin:0; padding:0; list-style:none; display:grid; gap:8px}
  .causa li{
    color:var(--texto-2); font-size:15px; line-height:1.5;
    padding-left:16px; position:relative;
  }
  .causa li::before{
    content:""; position:absolute; left:0; top:.6em;
    width:6px; height:6px; border-radius:50%; background:var(--acento); opacity:.55;
  }
  .bloque-accion{background:var(--panel-2)}
  .bloque-accion p{margin:0; color:var(--texto); font-size:15px}

  /* ---- veredicto sobre una causa ---- */
  .bloque-veredicto{background:var(--panel-2); display:flex; flex-wrap:wrap;
    gap:10px; align-items:center}
  .btn{
    font:inherit; font-size:14.5px; font-weight:600; cursor:pointer;
    padding:7px 16px; border-radius:7px; border:1px solid var(--borde);
    background:var(--panel); color:var(--texto);
  }
  .btn:hover{border-color:var(--acento); color:var(--acento)}
  .btn-si{border-color:var(--ok); color:var(--ok)}
  .btn-si:hover{background:var(--ok); color:#fff; border-color:var(--ok)}
  .btn-no{border-color:var(--malo); color:var(--malo)}
  .btn-no:hover{background:var(--malo); color:#fff; border-color:var(--malo)}
  .btn-sec{font-weight:400; font-size:13px; padding:5px 12px; color:var(--tenue)}

  /* Las dos causas juzgadas se rodean, cada una de su color. La descartada NO
     se atenua: lo que lleva dentro es la evidencia que escribio una persona, y
     es la parte mas valiosa del expediente -- dejarla al 62 % de opacidad la
     hacia costosa de leer justo a quien tiene que leerla. La tachadura del
     titulo ya dice que esa causa esta fuera de juego. */
  .causa.confirmada{border-color:var(--ok); border-left:4px solid var(--ok)}
  .causa.descartada{border-color:var(--malo); border-left:4px solid var(--malo)}
  .causa.descartada .q{
    text-decoration:line-through; text-decoration-thickness:1px; color:var(--texto-2);
  }
  .marca{
    display:inline-block; font-size:12.5px; font-weight:700; padding:3px 11px;
    border-radius:20px; letter-spacing:.02em;
  }
  .marca-si{background:var(--ok); color:#fff}
  .marca-no{background:var(--malo); color:#fff}

  /* El formulario de descarte. Mientras esta abierto se suspende el refresco
     automatico del detalle: re-pintar por debajo de alguien que esta
     escribiendo le borraria el texto. */
  .form-descarte{display:grid; gap:9px; width:100%}
  .form-descarte label{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--tenue); font-weight:600;
  }
  .form-descarte label .opcional{text-transform:none; letter-spacing:0; font-weight:400}
  .form-descarte textarea{
    font:inherit; font-size:15px; padding:9px 11px; border-radius:7px;
    border:1px solid var(--borde); background:var(--panel); color:var(--texto);
    resize:vertical; min-height:62px; width:100%;
  }
  .form-descarte textarea:focus{outline:2px solid var(--acento); outline-offset:-1px}
  .form-acciones{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
  .error-form{color:var(--malo); font-size:14px; font-weight:600}
  .evidencia-dada{
    width:100%; font-size:14.5px; color:var(--texto-2);
    border-left:2px solid var(--borde); padding-left:12px;
  }
  .evidencia-dada b{
    display:block; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--tenue); margin-bottom:3px;
  }
  .evidencia-dada + .evidencia-dada{margin-top:8px}
  .cuando-veredicto{font-size:12.5px; color:var(--tenue)}

  .chip{
    display:inline-block; font-size:11.5px; font-weight:600; padding:2px 9px;
    border-radius:20px; letter-spacing:.03em; white-space:nowrap;
  }
  /* 'listo' destaca mas que el resto a proposito: es el unico estado que pide
     algo de alguien. Los demas solo informan de que el sistema sigue a lo suyo. */
  .e-finalizado{
    background:var(--ok); color:#FFFFFF; font-weight:700;
    box-shadow:0 1px 3px rgba(30,115,70,.35);
  }
  .e-analizando,.e-recibido{background:var(--aviso-fondo); color:var(--aviso)}
  .e-fallido{background:var(--malo-fondo); color:var(--malo)}
  .e-pausado,.e-interrumpido{background:var(--neutro-fondo); color:var(--neutro)}

  /* Las etiquetas de cierre, solo en la pestaña de cerrados. La confirmada
     destaca por el mismo motivo que 'listo' en activos: es la unica que dice
     que el sistema acerto. */
  .c-causa_confirmada{background:var(--ok); color:#fff; font-weight:700}
  .c-causa_no_determinada{background:var(--aviso-fondo); color:var(--aviso)}
  .c-revisado_parcialmente{background:var(--acento-fondo); color:var(--acento)}
  .c-sin_veredicto{background:var(--neutro-fondo); color:var(--neutro)}
  .c-fallo_del_analisis{background:var(--malo-fondo); color:var(--malo)}

  /* Aviso de que el interruptor esta bajado. Sustituye a listar los incidentes
     en 'pausado': eso no es informacion de un incidente sino del sistema
     entero, y cuarenta filas iguales serian ruido donde basta una linea. */
  .aviso-parado{
    padding:11px 24px; background:var(--aviso-fondo); color:var(--aviso);
    font-size:14px; font-weight:600; border-bottom:1px solid var(--borde);
    flex:0 0 auto;
  }

  .aviso-ia{
    margin-top:26px; padding:12px 16px; border-radius:8px;
    background:var(--panel); border:1px solid var(--borde);
    font-size:13.5px; color:var(--texto-2);
  }
  .aviso-ia b{color:var(--aviso)}
  .pulso{animation:lat 1.6s ease-in-out infinite}
  @keyframes lat{0%,100%{opacity:1}50%{opacity:.35}}
  @media(prefers-reduced-motion:reduce){ .pulso{animation:none} }
</style>
</head>
<body>

<header>
  <h1>RCA — Sala de control</h1>
  <span id="resumen" class="reloj"></span>
  <span id="reloj" class="reloj"></span>
</header>

<div id="aviso-parado"></div>

<div class="cols">
  <nav class="lista">
    <div class="cabecera-lista">
      <div class="pestanas" id="pestanas"></div>
      <div class="rango" id="rango"></div>
      <div class="filtros" id="filtros"></div>
      <div id="truncado"></div>
    </div>
    <div id="lista"></div>
  </nav>
  <main class="detalle" id="detalle">
    <p class="vacio">Selecciona un incidente.</p>
  </main>
</div>

<script>
"use strict";

// Cada cuánto se vuelve a preguntar. 5 s es suficiente para un monitor: un
// análisis tarda minutos, así que refrescar más deprisa solo gasta.
const CADA_MS = 5000;

let seleccionado = null;
let ultimoOk = null;
let filtro = "";   // "" = todos; si no, el estado por el que se filtra

// Que ventana de incidentes se pide. Hace falta porque no se borra ninguno
// nunca: con veinte alertas al dia son 7.300 al ano, y esa lista no la lee
// nadie en un monitor. Los valores iniciales los pone el servidor.
let rango = {horas: null, desde: "", hasta: "", limite: null};

// Indice de la causa cuyo formulario de descarte esta abierto, o null.
//
// Mientras hay uno abierto se suspende el re-pintado del detalle: la pantalla
// se refresca cada 5 s, y re-pintar por debajo de alguien que esta escribiendo
// la evidencia le borraria el texto. La lista sigue actualizandose.
let formAbierto = null;
let errorForm = "";

// Id del incidente que se mantiene en la lista aunque haya dejado de cumplir el
// filtro, porque fue una accion del propio operario la que lo saco. Se pone al
// dar un veredicto y se suelta al tocar cualquier filtro.
let fijado = null;

// Suelta el incidente fijado. Se llama desde TODOS los controles que cambian la
// consulta -- pestaña, periodo, maximo, fechas y pastillas de estado --, porque
// tocar cualquiera de ellos es decir "enseñame otra cosa".
function soltarFijado(){ fijado = null; }

// false = pestaña de activos; true = la de cerrados.
let verCerrados = false;

const CIERRES = {
  causa_confirmada:      "Causa confirmada",
  causa_no_determinada:  "Causa no determinada",
  revisado_parcialmente: "Revisado parcialmente",
  sin_veredicto:         "Sin veredicto",
  fallo_del_analisis:    "Fallo del análisis",
};

const PERIODOS = [
  ["8",   "Últimas 8 h"],
  ["24",  "Últimas 24 h"],
  ["72",  "Últimos 3 días"],
  ["168", "Últimos 7 días"],
  ["0",   "Todo"],
  ["x",   "Rango concreto…"],
];

const ESTADOS = {
  recibido:    "en cola",
  analizando:  "procesando",
  // "listo" solo decia que el analisis habia terminado, y quien lo leia no
  // sacaba de ahi que se esperase algo de el. "Pendiente de revisar" dice lo
  // mismo y ademas dice a quien le toca -- que es lo unico que puede hacer que
  // alguien pulse un boton en vez de irse.
  finalizado:  "pendiente de revisar",
  fallido:     "fallo del análisis",
  interrumpido:"interrumpido",
  pausado:     "en pausa",
};

const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => (
  {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
));

// Las horas llegan en UTC desde PI. Se muestran en la del navegador, que es la
// de la planta: un operario no debe tener que restar dos horas mentalmente.
function fecha(iso){
  if(!iso) return null;
  const d = new Date(iso.endsWith("Z") ? iso : iso + "Z");
  return isNaN(d) ? null : d;
}

function hora(iso){
  const d = fecha(iso);
  return d ? d.toLocaleString("es-ES",
    {day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : (iso || "—");
}

// Cuanto lleva pasando es mas util que a que hora empezo: el operario quiere
// saber si esto es de hace diez minutos o de ayer, no hacer la resta.
// Pasada una semana se deja de contar hacia atras y se da la fecha.
//
// No es por coste: esto son tres restas por fila sobre una lista ya recortada a
// 500 como mucho, y pintar esas filas cuesta cien veces mas. Es porque "hace 92
// dias 7 h" no le sirve a nadie -- hay que hacer la cuenta mental al reves para
// saber de que dia habla. Lo relativo es util mientras el suceso siga en la
// cabeza de quien lee; a partir de ahi, la fecha.
const DIAS_EN_RELATIVO = 7;

function desde(iso){
  const d = fecha(iso);
  if(!d) return "";
  const min = Math.floor((Date.now() - d.getTime()) / 60000);
  if(min < 0)  return "";
  if(min < 1)  return "ahora mismo";
  if(min < 60) return `hace ${min} min`;
  const h = Math.floor(min / 60);
  if(h < 24)   return `hace ${h} h${min % 60 ? ` ${min % 60} min` : ""}`;
  const dias = Math.floor(h / 24);
  if(dias > DIAS_EN_RELATIVO){
    // Con año solo cuando no es el actual: el "de 2026" repetido en todas las
    // filas es ruido, y el año importa justo cuando NO es el que se da por hecho.
    const esteAno = d.getFullYear() === new Date().getFullYear();
    return d.toLocaleDateString("es-ES", {day: "numeric", month: "short",
      ...(esteAno ? {} : {year: "numeric"})})
      + " · " + d.toLocaleTimeString("es-ES", {hour: "2-digit", minute: "2-digit"});
  }
  return `hace ${dias} día${dias === 1 ? "" : "s"}${h % 24 ? ` ${h % 24} h` : ""}`;
}

const num = (v) => typeof v === "number" ? v.toLocaleString("es-ES") : esc(v ?? "—");

// Las evidencias de una causa, venga en el esquema nuevo o en el viejo.
//
// Hasta el 2026-09-14 el modelo devolvia "explanation": un parrafo unico que
// mezclaba los hechos con su interpretacion. Ahora devuelve "evidence", una
// lista de hechos sueltos. Los incidentes ya guardados conservan el campo viejo
// y no se migran -- un diagnostico es el registro de lo que el modelo dijo aquel
// dia --, asi que la pantalla lee los dos.
//
// Se devuelve tambien COMO hay que pintarlo, y no es un detalle: un parrafo de
// ocho lineas metido en una vinieta parece una lista rota. Si el dato es un
// parrafo, se pinta como parrafo.
function evidencias(c){
  if(Array.isArray(c.evidence)){
    const l = c.evidence.map(String).filter(e => e.trim());
    if(l.length) return {tipo:"lista", items:l};
  }
  if(typeof c.evidence === "string" && c.evidence.trim())
    return {tipo:"parrafo", items:[c.evidence]};
  if(typeof c.explanation === "string" && c.explanation.trim())
    return {tipo:"parrafo", items:[c.explanation]};
  return {tipo:"vacio", items:[]};
}

// LimitThresholdType dice de que lado salta la alarma: 'Low' es por debajo del
// limite, 'High' por encima. Decirlo con palabras ahorra deducirlo de los
// numeros, que es justo lo que hay que evitar en una sala de control.
function direccion(tipo){
  const t = String(tipo || "").toLowerCase();
  if(t === "low")  return "por debajo del límite";
  if(t === "high") return "por encima del límite";
  return "fuera del límite";
}

function chip(estado){
  return `<span class="chip e-${esc(estado)}${estado==="analizando"?" pulso":""}">`
       + `${esc(ESTADOS[estado] || estado)}</span>`;
}

// La marca que resume un incidente, en la lista y en el detalle.
//
// Si esta cerrado manda el CIERRE, no el estado del workflow: el cierre es
// posterior y dice mas. "Listo" solo cuenta que el analisis termino; "causa no
// determinada" cuenta en que acabo, que es lo que alguien quiere saber al abrir
// un expediente cerrado.
//
// Mientras sigue activo manda el estado: el cierre que se deduce ahi es
// provisional -- puede cambiar en cuanto alguien toque algo -- y presentarlo
// como si fuera un hecho seria adelantar una conclusion que no esta tomada.
function chipEstado(x){
  // Manda el CIERRE en dos casos: cuando el incidente esta cerrado, y cuando
  // sigue abierto pero YA HAY VEREDICTOS.
  //
  // Lo segundo se olvido al principio y producia una marca falsa: en cuanto
  // alguien descartaba una causa, la fila seguia diciendo "pendiente de
  // revisar" -- que afirma que nadie lo ha tocado, cuando acababan de
  // revisarlo a medias. El estado del workflow es 'finalizado' en los dos
  // casos, asi que por si solo no distingue nada.
  //
  // Sin veredictos si manda el estado: ahi "pendiente de revisar" es exacto, y
  // el cierre que se deduciria seria una conclusion que nadie ha tomado.
  const hayVeredictos = x.cierre && x.cierre !== "sin_veredicto";
  return (x.cerrado || hayVeredictos) && x.cierre
    ? `<span class="chip c-${esc(x.cierre)}">${esc(CIERRES[x.cierre] || x.cierre)}</span>`
    : chip(x.estado);
}

async function pedir(url){
  const r = await fetch(url, {cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

function pintarPestanas(cuentas){
  const cont = document.getElementById("pestanas");
  cont.innerHTML = [[false, "Activos"], [true, "Cerrados"]].map(([v, t]) =>
    `<button class="pestana" data-cerrados="${v}" aria-selected="${v === verCerrados}">`
    + `${esc(t)}<span class="cuenta">${cuentas[v ? "cerrados" : "activos"] ?? ""}</span>`
    + `</button>`).join("");
  cont.querySelectorAll(".pestana").forEach(b => b.onclick = () => {
    if((b.dataset.cerrados === "true") === verCerrados) return;
    verCerrados = b.dataset.cerrados === "true";
    soltarFijado();
    // Al cambiar de mundo no se arrastra nada del anterior: ni el filtro de
    // estado, ni la seleccion, ni un formulario a medio escribir sobre un
    // incidente que ya no se ve.
    filtro = ""; seleccionado = null; formAbierto = null; errorForm = "";
    refrescar();
  });
}

function pintarRango(){
  const personalizado = rango.horas === "x";
  document.getElementById("rango").innerHTML = `
    <label for="periodo">Periodo</label>
    <select id="periodo">${PERIODOS.map(([v,t]) =>
      `<option value="${v}"${String(rango.horas)===v?" selected":""}>${esc(t)}</option>`).join("")}</select>
    <div class="linea">
      <label for="limite">Más recientes</label>
      <input type="number" id="limite" min="1" max="500" step="1" value="${rango.limite}">
    </div>
    ${personalizado ? `<div class="personalizado">
      <label for="desde">De</label>
      <input type="datetime-local" id="desde" value="${esc(rango.desde)}">
      <label for="hasta">a</label>
      <input type="datetime-local" id="hasta" value="${esc(rango.hasta)}">
    </div>` : ""}`;

  document.getElementById("periodo").onchange = (e) => {
    rango.horas = e.target.value;
    if(rango.horas !== "x"){ rango.desde = ""; rango.hasta = ""; }
    soltarFijado();
    refrescar();
  };
  // Se acota tambien aqui, ademas de en el servidor: asi la casilla corrige lo
  // que el operario vea escrito en vez de dejarle un numero que el servidor
  // ignora por su cuenta.
  document.getElementById("limite").onchange = (e) => {
    const n = Number(e.target.value);
    rango.limite = Number.isFinite(n) ? Math.max(1, Math.min(Math.round(n), 500)) : 50;
    e.target.value = rango.limite;
    soltarFijado();
    refrescar();
  };
  ["desde","hasta"].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.onchange = (e) => { rango[id] = e.target.value; soltarFijado(); refrescar(); };
  });
}

// Traduce el rango elegido a los parametros del endpoint.
function parametros(){
  const p = new URLSearchParams();
  if(rango.horas === "x"){
    // datetime-local da hora LOCAL sin zona; el servidor compara en UTC.
    if(rango.desde) p.set("desde", new Date(rango.desde).toISOString().slice(0,19) + "Z");
    if(rango.hasta) p.set("hasta", new Date(rango.hasta).toISOString().slice(0,19) + "Z");
    if(!rango.desde && !rango.hasta) p.set("horas", "0");
  } else if(rango.horas !== null){
    p.set("horas", rango.horas);
  }
  if(rango.limite) p.set("limite", rango.limite);
  p.set("cerrados", verCerrados);
  // El filtro va al SERVIDOR, no se aplica aqui. Si se aplicase en el navegador,
  // el limite ya habria recortado sobre el conjunto equivocado: con un filtro
  // puesto y maximo 2 podian salir cero, porque el servidor mandaba los 2 mas
  // recientes de TODOS y aqui se descartaban.
  //
  // Y va por el parametro que corresponde a la pestaña: en activos se filtra
  // por estado del workflow; en cerrados, por etiqueta de cierre.
  if(filtro) p.set(verCerrados ? "cierre" : "estado", filtro);
  return p.toString() ? "?" + p.toString() : "";
}

function pintarFiltros(datos){
  // Las cuentas las da el SERVIDOR, sobre el periodo completo y antes de
  // recortar por el maximo. Contarlas aqui sobre la lista recibida daria
  // numeros falsos en cuanto el limite recortase algo.
  //
  // Y cada pestaña filtra por lo SUYO. En activos importa el estado del
  // workflow -- en cola, procesando, pendiente de revisar -- porque dice que
  // esta haciendo el sistema con la alerta. En cerrados importa COMO acabo:
  // filtrar alli por 'finalizado' no distinguiria nada, porque lo son casi
  // todos. Son dos preguntas distintas y necesitan dos botoneras distintas.
  //
  // Solo se ofrecen las opciones que hay ahora mismo. Una botonera fija de la
  // que la mitad de los botones dan cero es ruido.
  const cuentas = (verCerrados ? datos.recuentoCierre : datos.recuento) || {};
  const nombres = verCerrados ? CIERRES : ESTADOS;
  const opciones = [["", "Todos", datos.recuentoSinFiltro]].concat(
    Object.keys(cuentas).sort().map(e => [e, nombres[e] || e, cuentas[e]]));

  const cont = document.getElementById("filtros");
  cont.innerHTML = opciones.map(([valor, etiqueta, n]) =>
    `<button class="filtro" data-estado="${esc(valor)}" aria-pressed="${valor===filtro}">`
    + `${esc(etiqueta)}<span class="cuenta">${n}</span></button>`).join("");
  cont.querySelectorAll(".filtro").forEach(b =>
    b.onclick = () => { filtro = b.dataset.estado; soltarFijado(); refrescar(); });
}

// Por que no hay nada que enseñar.
//
// "Sin incidentes registrados" era mentira en el caso mas frecuente: SI los
// hay, pero fuera del periodo. Decirle a alguien que no existe nada cuando lo
// que pasa es que su filtro no lo alcanza es la pantalla mintiendo, y ademas lo
// deja sin saber que tiene que tocar para verlo.
function vacioPorque(){
  if(filtro) return "Ninguno en este estado dentro de este periodo.";
  const aqui = verCerrados ? "cerrado" : "activo";
  // Cuantos hay en la otra pestaña NO se dice: la pestaña ya lleva su cuenta.
  // Repetirlo aqui es ruido, y el unico dato que la pantalla no daba ya era que
  // el periodo puede estar escondiendolos.
  if(rango.horas === "0") return `Ninguno ${aqui}.`;
  return `Ninguno ${aqui} en este periodo. Amplía el periodo para ver más atrás.`;
}

// Construye una fila de la lista a partir del detalle. Hace falta para el
// incidente fijado: no viene en la respuesta de /incidentes porque ya no cumple
// el filtro, pero tiene que seguir viendose.
function filaDesdeDetalle(d){
  return {
    id: d.id, asset: d.asset, kpiName: d.kpi_name,
    startTime: d.start_time, recibidoEn: d.recibido_en,
    estado: d.estado, cierre: d.cierre, cerrado: d.cerrado,
    // POR QUE se ha salido de la lista, que son dos cosas distintas y llevan a
    // acciones distintas:
    //
    //   "pestana" -- ha cambiado de sitio en la aplicacion. Quitar el filtro no
    //                lo trae de vuelta: hay que ir a la otra pestaña.
    //   "filtro"  -- sigue en esta pestaña pero ya no cumple el filtro de
    //                estado o de cierre. Quitandolo, reaparece.
    //
    // Un texto unico para las dos obligaria a adivinar en cual estas, y en el
    // primer caso seria ademas falso: no ha dejado de cumplir un filtro, se ha
    // mudado.
    motivoFijado: d.cerrado !== verCerrados ? "pestana" : "filtro",
  };
}

// En su sitio por fecha, no arriba del todo: la lista va ordenada por cuando se
// recibio, y moverlo seria un salto visual mas encima del que acaba de dar el
// estado. El resaltado de "seleccionado" ya lo distingue de sobra.
function insertarPorFecha(lista, fila){
  const copia = lista.slice();
  const i = copia.findIndex(x => (x.recibidoEn || "") < (fila.recibidoEn || ""));
  copia.splice(i < 0 ? copia.length : i, 0, fila);
  return copia;
}

function pintarLista(incidentes){
  const cont = document.getElementById("lista");
  if(!incidentes.length){
    cont.innerHTML = `<p class="vacio" style="padding:18px">${vacioPorque()}</p>`;
    return;
  }
  cont.innerHTML = incidentes.map(i => `
    <button class="fila" data-id="${esc(i.id)}" aria-current="${i.id===seleccionado}">
      <div class="act">${esc(i.asset)}</div>
      <div class="sub">${esc(i.kpiName)}</div>
      <div class="sub" style="color:var(--tenue)">${esc(desde(i.startTime) || hora(i.startTime))}</div>
      <div class="pie">${chipEstado(i)}</div>
      ${i.motivoFijado ? `<div class="fijada"><span class="chincheta">📌</span>${
        // Que sigue ahi porque esta seleccionado lo dice el DISEÑO -- la fila
        // resaltada y la chincheta --, no el texto. Escribir con palabras lo
        // que la forma ya dice es lo que alargaba la fila.
        i.motivoFijado === "pestana"
          ? `Ahora está en ${verCerrados ? "Activos" : "Cerrados"}`
          : "Ya no coincide con el filtro"
      }</div>` : ""}
    </button>`).join("");
  cont.querySelectorAll(".fila").forEach(b =>
    b.onclick = () => {
      seleccionado = b.dataset.id;
      // El detalle vuelve arriba al cambiar de incidente. Si no, quien estaba
      // leyendo la tercera causa de uno largo aterriza a media pagina del
      // siguiente, sin ver de que activo es.
      document.getElementById("detalle").scrollTop = 0;
      refrescar();
    });
}

// El ultimo apunte sobre una causa. Los veredictos son una lista de solo
// anadir, asi que corregir deja los dos: el que vale es el ultimo.
function ultimoApunte(d, n){
  const v = ((d.revision || {}).veredictos || []).filter(x => x.causa === n);
  return v.length ? v[v.length - 1] : null;
}

// Que se puede hacer con una causa, segun como este.
function zonaVeredicto(d, n, estado, estados){
  // Con una causa ya confirmada, la pregunta esta contestada: juzgar las demas
  // no aporta nada y solo invita a dejar el expediente en un estado raro. La
  // confirmada conserva su "Deshacer", que es la via para rectificar.
  const hayConfirmada = estados.includes("confirmada");
  if(hayConfirmada && estado !== "confirmada"){
    return estado === "descartada" ? bloqueDescartada(d, n) : "";
  }

  if(formAbierto === n){
    const previo = ultimoApunte(d, n) || {};
    return `<div class="bloque bloque-veredicto">
      <form class="form-descarte" data-causa="${n}">
        <div>
          <label for="ev${n}">Por qué no es esta causa</label>
          <textarea id="ev${n}" name="evidencia" required
            placeholder="Lo que has comprobado. Por ejemplo: «no hay obstrucción, inspección visual del rodete»."
            >${esc(previo.evidencia || "")}</textarea>
        </div>
        <div>
          <label for="sos${n}">Qué sospechas tú <span class="opcional">— opcional</span></label>
          <textarea id="sos${n}" name="sospecha"
            placeholder="Si tienes una idea de por dónde puede ir."
            >${esc(previo.sospecha || "")}</textarea>
        </div>
        <div class="form-acciones">
          <button type="submit" class="btn btn-no">Descartar causa</button>
          <button type="button" class="btn btn-sec" data-cancelar="1">Cancelar</button>
          ${errorForm ? `<span class="error-form">${esc(errorForm)}</span>` : ""}
        </div>
      </form></div>`;
  }

  if(estado === "confirmada"){
    // "por el operario" y no solo "confirmada": lo que hay que distinguir es
    // que esto NO lo decidio el modelo. En la misma pantalla conviven lo que
    // propuso la IA y lo que concluyo una persona, y confundirlos es
    // exactamente lo que este proyecto lleva evitando.
    return `<div class="bloque bloque-veredicto">
      <span class="marca marca-si">Confirmada por el operario</span>
      <button class="btn btn-sec" data-deshacer="${n}">Deshacer</button></div>`;
  }

  if(estado === "descartada") return bloqueDescartada(d, n, true);

  return `<div class="bloque bloque-veredicto">
    <button class="btn btn-si" data-confirmar="${n}">Es esta causa</button>
    <button class="btn btn-no" data-descartar="${n}">No es esta</button></div>`;
}

// Lo que se enseña de una causa descartada. 'conBoton' es false cuando otra
// causa ya esta confirmada: la evidencia se sigue viendo -- es el trabajo que
// hizo alguien y no se tira -- pero ya no hay nada que rectificar aqui.
function bloqueDescartada(d, n, conBoton){
  const a = ultimoApunte(d, n) || {};
  return `<div class="bloque bloque-veredicto">
    <span class="marca marca-no">Descartada por el operario</span>
    ${conBoton ? `<button class="btn btn-sec" data-deshacer="${n}">Deshacer</button>` : ""}
    ${a.en ? `<span class="cuando-veredicto">${desde(a.en) || hora(a.en)}</span>` : ""}
    ${a.evidencia ? `<div class="evidencia-dada"><b>Por qué no era</b>${esc(a.evidencia)}</div>` : ""}
    ${a.sospecha ? `<div class="evidencia-dada"><b>Lo que se sospecha</b>${esc(a.sospecha)}</div>` : ""}
    </div>`;
}

async function enviarVeredicto(iid, cuerpo){
  const r = await fetch(`/incidentes/${encodeURIComponent(iid)}/veredicto`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(cuerpo),
  });
  if(!r.ok){
    // El mensaje del servidor esta escrito para quien esta delante de la
    // pantalla, asi que se enseña tal cual.
    const cuerpoErr = await r.json().catch(() => ({}));
    throw new Error(cuerpoErr.detail || "No se pudo guardar.");
  }
  // Un veredicto puede cambiar el estado o el cierre del incidente y sacarlo
  // del filtro que hay puesto. Se fija para que no desaparezca de debajo de
  // quien acaba de darlo: los contadores y su etiqueta si se actualizan, pero
  // el sitio se conserva hasta que se toque un filtro.
  fijado = iid;
  return r.json();
}

// Los manejadores van aqui y no como atributos onclick en el HTML: asi el
// contenido del modelo nunca se concatena dentro de codigo ejecutable.
function conectarVeredictos(iid){
  const cont = document.getElementById("detalle");

  cont.querySelectorAll("[data-confirmar]").forEach(b => b.onclick = async () => {
    try{
      pintarDetalle(await enviarVeredicto(iid, {causa: +b.dataset.confirmar, veredicto: "confirmada"}));
    }catch(e){ errorForm = e.message; refrescar(); }
  });

  cont.querySelectorAll("[data-descartar]").forEach(b => b.onclick = () => {
    formAbierto = +b.dataset.descartar;      // suspende el refresco del detalle
    errorForm = "";
    refrescar();
  });

  cont.querySelectorAll("[data-deshacer]").forEach(b => b.onclick = async () => {
    // Deshacer no borra: anota "pendiente" encima y el expediente conserva los
    // dos apuntes. Sin pedir motivo -- casi siempre sera un clic mal dado, y
    // poner fricción a corregir un error solo consigue que no se corrija.
    try{
      pintarDetalle(await enviarVeredicto(iid, {causa: +b.dataset.deshacer, veredicto: "pendiente"}));
    }catch(e){ errorForm = e.message; refrescar(); }
  });

  const form = cont.querySelector(".form-descarte");
  if(form){
    form.querySelector("[data-cancelar]").onclick = () => {
      formAbierto = null; errorForm = ""; refrescar();
    };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const evidencia = form.evidencia.value.trim();
      if(!evidencia){
        // Se comprueba aqui ademas de en el servidor: asi el aviso sale al
        // instante y sin perder lo escrito en el otro campo.
        errorForm = "Hace falta decir por qué no es esta causa.";
        return refrescar();
      }
      try{
        const actualizado = await enviarVeredicto(iid, {
          causa: formAbierto, veredicto: "descartada",
          evidencia, sospecha: form.sospecha.value.trim(),
        });
        formAbierto = null; errorForm = "";
        pintarDetalle(actualizado);
      }catch(err){ errorForm = err.message; refrescar(); }
    };
    form.querySelector("textarea").focus();
  }
}

function pintarDetalle(d){
  const p = d.payload || {};
  const causas = (d.diagnostico && d.diagnostico.root_causes) || [];
  const ia = d.diagnostico && d.diagnostico._ai_generated;

  // El motivo, cuando lo hay, se dice con las palabras que guardo el workflow.
  // Es lo unico que separa un "fallo del analisis" util de uno que obliga a
  // abrir el log del servicio -- que quien mira este monitor no va a hacer.
  const motivo = d.motivo ? `<p class="motivo">${esc(d.motivo)}</p>` : "";

  let cuerpo = "";
  if(d.estado === "analizando"){
    cuerpo = `<p class="vacio">El análisis está en marcha. Esta pantalla se
              actualiza sola en cuanto termine.</p>`;
  } else if(d.estado === "recibido"){
    // NO es lo mismo que 'analizando', y confundirlos hacia que la pantalla
    // dijera "en marcha" de algo que ni siquiera habia empezado. El porque
    // espera (el limite de simultaneos) es fontaneria nuestra: al operario le
    // basta con saber que esta registrada y que va a analizarse.
    cuerpo = `<p class="vacio">La alerta está registrada y espera turno para ser
              analizada.</p>`;
  } else if(d.estado === "fallido"){
    cuerpo = `<p class="vacio">El análisis no pudo completarse, así que no hay
              diagnóstico para este incidente.</p>${motivo}`;
  } else if(d.estado === "pausado"){
    cuerpo = `<p class="vacio">Llegó con el análisis automático desactivado, así
              que no se ha ejecutado. La alerta queda registrada y se retomará
              cuando vuelva a activarse.</p>`;
  } else if(d.estado === "interrumpido"){
    cuerpo = `<p class="vacio">El análisis se cortó a mitad porque el servicio se
              detuvo. No llegó a producir diagnóstico. Se reintentará cuando PI
              vuelva a notificar esta alerta.</p>`;
  } else if(!causas.length){
    cuerpo = `<p class="vacio">Sin causas propuestas.</p>`;
  } else {
    const estados = d.estadoCausas || causas.map(() => "pendiente");

    // En la pestaña de cerrados, la causa confirmada va primero: en un
    // expediente cerrado lo que se busca es la respuesta, no el orden en que el
    // modelo la propuso. En activos se respeta el orden del modelo, que esta
    // por probabilidad decreciente y es el que guia la revision.
    //
    // El NUMERO no se toca: si era la 2 de 3, sigue diciendo 2 de 3. Renumerar
    // haria que el expediente y la conversacion sobre el ("la segunda causa")
    // dejasen de coincidir.
    const orden = causas.map((c, n) => n);
    if(verCerrados){
      orden.sort((a, b) =>
        (estados[b] === "confirmada") - (estados[a] === "confirmada") || a - b);
    }

    cuerpo = `<h3>Causas propuestas</h3>` + orden.map(n => {
      const c = causas[n];
      const ev = evidencias(c);
      return `
      <article class="causa ${esc(estados[n])}">
        <div class="n">CAUSA ${n+1} DE ${causas.length}</div>
        <div class="bloque bloque-problema">
          <b>Problema</b>
          <h4 class="q">${esc(c.cause)}</h4>
        </div>
        ${ev.tipo === "vacio" ? "" : `<div class="bloque"><b>Evidencias</b>${
          ev.tipo === "lista"
            ? `<ul>${ev.items.map(e => `<li>${esc(e)}</li>`).join("")}</ul>`
            // Esquema viejo: un parrafo. Se pinta como parrafo, no como una
            // vinieta gigante que parezca una lista rota.
            : `<p class="parrafo">${esc(ev.items[0])}</p>`
        }</div>`}
        ${c.recommended_action ? `<div class="bloque bloque-accion">
          <b>Acción recomendada</b><p>${esc(c.recommended_action)}</p></div>` : ""}
        ${zonaVeredicto(d, n, estados[n], estados)}
      </article>`;
    }).join("");
  }

  // El contexto tenue: donde esta y desde cuando. La planta NO se muestra --
  // esto es de una sola planta, asi que repetir "WWTP" en cada incidente no
  // distingue nada y solo compite por la atencion.
  // Ni la planta ni la hora de recepcion. La planta es siempre la misma y no
  // distingue nada. La hora a la que NOSOTROS recibimos el POST es fontaneria
  // interna: a las personas las avisa PI cuando arranca la alarma, no cuando
  // este servicio se entera, asi que enseñar esa diferencia solo confundia.
  const arranque = desde(d.start_time);
  const contexto = [
    p.Subsystem ? `<b>${esc(p.Subsystem)}</b>` : "",
    d.start_time
      ? `empezó ${arranque ? arranque + " " : ""}<b>(${hora(d.start_time)})</b>`
      : "",
  ].filter(Boolean);

  document.getElementById("detalle").innerHTML = `
    <div class="bloque-cabecera">
      ${chipEstado(d)}
      <h2 class="titulo">${esc(d.asset)}</h2>
      <p class="problema">
        <span class="kpi">${esc(d.kpi_name)}</span> ${esc(direccion(d.threshold_type))}
        <span class="cifras">${num(p.KPI)} frente a un límite de ${num(p.Limit)}</span>
      </p>
      <p class="contexto">${contexto.join('<span class="sep">·</span>')}</p>
    </div>
    ${cuerpo}
    ${ia ? `<p class="aviso-ia"><b>Generado por IA.</b> ${esc(ia.notice)}
            <br><span style="color:var(--tenue)">Modelo: ${esc(ia.model)}</span></p>`
         : `<p class="aviso-ia"><b>Aviso.</b> Los diagnósticos de esta pantalla
            los genera un sistema de inteligencia artificial a partir de datos de
            PI. Son hipótesis pendientes de verificación, no causas
            confirmadas.</p>`}`;

  conectarVeredictos(d.id);
}

// 'auto' distingue el refresco del temporizador del que disparan los botones.
// Solo el automatico se abstiene de re-pintar el detalle cuando hay un
// formulario abierto: la lista sigue actualizandose, asi que el monitor no se
// congela aunque alguien deje el formulario abierto y se marche.
async function refrescar({reintento = false, auto = false} = {}){
  try{
    const datos = await pedir("/incidentes" + parametros());

    // Si la opcion filtrada ya no existe (termino el ultimo 'procesando', o se
    // cambio de pestaña y el valor no tiene sentido en la otra), se vuelve a
    // Todos y se pide de nuevo. Antes esto se hacia al pintar los filtros, y
    // dejaba en pantalla una lista traida con el filtro viejo.
    //
    // Se mira el recuento de la pestaña ACTUAL -- recuentoCierre en cerrados,
    // recuento en activos --, nunca solo 'recuento': eso comprobaba el filtro
    // de cerrados (p.ej. "causa_confirmada") contra las claves de activos
    // (p.ej. "finalizado"), que nunca coinciden, asi que todo filtro en
    // Cerrados se autoanulaba antes de que se viera en pantalla.
    //
    // 'reintento' corta cualquier posibilidad de bucle: como mucho, una vez.
    const cuentasPestanaActual = (verCerrados ? datos.recuentoCierre : datos.recuento) || {};
    if(filtro && !cuentasPestanaActual[filtro] && !reintento){
      filtro = "";
      return refrescar({reintento: true, auto});
    }

    const incidentes = datos.incidentes;

    // La primera vez, los valores por defecto los pone el servidor: asi la
    // pantalla no lleva su propia copia que se desincronice del config.
    if(rango.horas === null){
      rango.limite = datos.filtro.limite;
      const h = datos.filtro.desde
        ? Math.round((Date.now() - new Date(datos.filtro.desde).getTime()) / 3600000)
        : 0;
      rango.horas = String([8,24,72,168].reduce((a,b) =>
        Math.abs(b - h) < Math.abs(a - h) ? b : a, 24));
    }
    pintarPestanas(datos.pestanas || {});
    pintarRango();

    // Aviso cuando el limite recorta: la pantalla dice cuantos se esta dejando
    // fuera en vez de mentir por omision.
    // Informativo, no una advertencia: que el limite recorte es lo normal y
    // esperado, no algo que haya ido mal.
    document.getElementById("truncado").innerHTML = datos.truncado
      ? `<div class="aviso-truncado">Se muestran los ${datos.mostrados} más
         recientes de ${datos.coincidentes}.</div>` : "";

    // La lista ya viene filtrada y recortada por el servidor: aqui no se
    // descarta nada mas.
    pintarFiltros(datos);                            // puede reajustar 'filtro'

    // Un incidente FIJADO sigue en la lista aunque haya dejado de cumplir el
    // filtro. El caso: filtras por "sin veredicto", confirmas una causa, y el
    // incidente pasa a "causa confirmada" -- deja de cumplir el filtro y la
    // pantalla te lo quitaba de debajo y te metia en el detalle de otra bomba.
    // Es castigar al operario por hacer justo lo que se le pedia.
    //
    // Los contadores y su estado SI se actualizan: lo unico que se conserva es
    // su sitio. Y se suelta en cuanto se toca un filtro, que es la forma de
    // decir "enseñame otra cosa".
    const visible = incidentes.some(i => i.id === seleccionado);
    if(seleccionado && !visible && seleccionado !== fijado) seleccionado = null;
    if(!seleccionado && incidentes.length) seleccionado = incidentes[0].id;

    let lista = incidentes;
    if(seleccionado && !visible && seleccionado === fijado){
      // No viene en la respuesta, asi que su fila se construye del detalle --
      // que hay que pedir igualmente para el panel central.
      const det = await pedir("/incidentes/" + encodeURIComponent(seleccionado));
      lista = insertarPorFecha(incidentes, filaDesdeDetalle(det));
    }
    pintarLista(lista);

    document.getElementById("resumen").textContent =
      `${datos.mostrados} incidente${datos.mostrados===1?"":"s"}`;

    if(seleccionado && auto && formAbierto !== null){
      // Alguien esta escribiendo la evidencia. Re-pintar por debajo le borraria
      // el texto, asi que el detalle se deja como esta. La lista ya se ha
      // actualizado arriba.
    }else if(seleccionado){
      pintarDetalle(await pedir("/incidentes/" + encodeURIComponent(seleccionado)));
    }else if(formAbierto !== null){
      // No deberia ocurrir -- el formulario vive dentro del incidente
      // seleccionado --, pero si el filtro lo sacara de la lista, cerrarlo es
      // mejor que dejar un formulario huerfano que escribe en un incidente que
      // ya no se ve.
      formAbierto = null; errorForm = "";
      document.getElementById("detalle").innerHTML =
        '<p class="vacio">Selecciona un incidente.</p>';
    }else{
      // Sin nada seleccionado hay que limpiar el detalle. Si no, se queda el del
      // incidente anterior junto a una lista que ya no lo contiene: la pantalla
      // estaria enseñando una alerta que el filtro dice que no esta ahi.
      document.getElementById("detalle").innerHTML =
        '<p class="vacio">Selecciona un incidente.</p>';
    }

    // El interruptor de parada es informacion del SISTEMA, no de un incidente:
    // si esta bajado, las alertas se registran y no se analizan, y quien mira la
    // pantalla tiene que saberlo aunque la lista parezca normal.
    try{
      const salud = await pedir("/health");
      document.getElementById("aviso-parado").innerHTML = salud.workflow_enabled
        ? ""
        : `<div class="aviso-parado">El análisis automático está desactivado.
           Las alertas se registran pero no se analizan.</div>`;
    }catch(e){ /* si /health falla, ya lo dira el indicador de contacto */ }

    ultimoOk = new Date();
    document.getElementById("reloj").className = "reloj";
    document.getElementById("reloj").textContent =
      "actualizado " + ultimoOk.toLocaleTimeString("es-ES");
  }catch(e){
    // Se dice que se perdió el contacto en vez de dejar datos viejos con pinta
    // de recientes. Una pantalla que miente en una sala de control es peor que
    // una que admite que no sabe.
    const r = document.getElementById("reloj");
    r.className = "reloj caido";
    r.textContent = ultimoOk
      ? "SIN CONTACTO — último dato " + ultimoOk.toLocaleTimeString("es-ES")
      : "SIN CONTACTO con el servicio";
  }
}

refrescar();
setInterval(() => refrescar({auto: true}), CADA_MS);
</script>
