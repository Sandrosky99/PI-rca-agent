# Gate de calidad — extensions/ai-governance-spec.md §2.4 [MUST]
#
# "The CI/CD pipeline MUST block deployment if the defined quality, security,
#  and testing thresholds are not met — with no exception for AI-generated code."
#
# Este workflow falla la rama si las pruebas no pasan, si hay dependencias con
# vulnerabilidades conocidas o si el analisis estatico encuentra problemas de
# seguridad. Al fallar, bloquea el merge (configurar como required check en la
# proteccion de rama de GitHub).
name: quality-gate

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ejecutar suites
        # Las suites usan dobles para el LLM y los MCP servers: no hacen falta
        # ni claves de API ni acceso a PI System.
        run: python tests/run_all.py

  security:
    name: Seguridad (SAST + SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -r requirements.txt

      # SAST: patrones inseguros en el codigo (ai-governance §1.2, §1.6).
      # Se excluye tests/ y se falla solo con severidad media o superior.
      - name: SAST (bandit)
        run: bandit -r . -x ./tests,./.venv -ll

      # SCA: vulnerabilidades conocidas en las dependencias (base §5).
      - name: SCA (pip-audit)
        run: pip-audit --requirement requirements.txt --strict

  secrets:
    name: Sin secretos en el codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # base/software-spec §5 y ai-governance §1.1: ni claves ni tokens en el
      # repositorio. Comprobacion barata que atrapa el descuido tipico.
      - name: Buscar credenciales
        run: |
          set +e
          PATRON='sk-ant-[A-Za-z0-9]|AIza[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}'
          HALLAZGOS=$(grep -rInE "$PATRON" --exclude-dir=.git --exclude-dir=.venv . \
                      | grep -v 'aqui-va-tu-clave')
          if [ -n "$HALLAZGOS" ]; then
            echo "Posibles credenciales en el repositorio:"
            echo "$HALLAZGOS"
            exit 1
          fi
          echo "Sin credenciales detectadas."
      - name: Comprobar que .env no esta versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "ERROR: .env esta versionado. Debe estar en .gitignore."
            exit 1
          fi
          echo ".env no esta versionado."
